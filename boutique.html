<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#203d37">
  <title>Produk – AveStore</title>
  <meta name="description" content="Jelajahi gitar, piano, keyboard, drum, bass, dan perlengkapan audio di AveStore.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body data-page="boutique">
  <div id="site-header"></div>
  <main class="container shop-main">
    <div class="page-head">
      <span class="eyebrow">Katalog AveStore</span>
      <h1>Temukan alat musik pilihanmu</h1>
      <p>Jelajahi instrumen, bandingkan detail, lalu hubungi kami untuk informasi lebih lanjut.</p>
    </div>
    <div class="shop-toolbar">
      <div class="chips" id="chips" role="group" aria-label="Saring berdasarkan kategori"></div>
      <p class="count" id="count" aria-live="polite"></p>
    </div>
    <div class="grid" id="shop-grid"></div>
    <p class="empty" id="empty" hidden>Produk tidak ditemukan. Coba kategori atau kata kunci lain.</p>
  </main>
  <div id="site-footer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
